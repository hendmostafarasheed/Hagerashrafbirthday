<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#39442a"><title>Hager's Birthday Invitation</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,serif}html{background:#29311f}body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,#626c49,#29311f 75%);overflow-x:hidden}.invitation{position:relative;width:min(100vw,66.6dvh);max-width:665px;margin:auto;box-shadow:0 16px 55px #0008;flex:none}.screen{position:relative;width:100%}.screen[hidden]{display:none!important}.screen img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}.hotspot{position:absolute;z-index:2;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border-radius:30%;isolation:isolate;overflow:hidden}.hotspot::before{content:"";position:absolute;inset:8%;border-radius:inherit;background:linear-gradient(110deg,transparent 25%,rgba(255,246,197,.33) 47%,transparent 70%);transform:translateX(-150%);animation:glimmer 3.8s ease-in-out infinite;pointer-events:none}.hotspot::after{content:"";position:absolute;inset:5%;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,227,158,.05);animation:softglow 2.8s ease-in-out infinite;pointer-events:none}.hotspot:focus-visible{outline:3px solid #fff0bd;outline-offset:-2px}.hotspot:active,.hotspot.pressed{background:rgba(255,241,190,.25);box-shadow:inset 0 0 24px #fff8,0 0 22px #ffdf9c;filter:brightness(1.25)}.hotspot:active{transform:scale(.97)}@keyframes glimmer{0%,35%{transform:translateX(-150%)}65%,100%{transform:translateX(150%)}}@keyframes softglow{0%,100%{opacity:.15}50%{opacity:1}}.open{left:22%;top:80.6%;width:57%;height:10.2%;border-radius:48%}.location,.photos,.video,.comment{top:59.2%;height:18.6%;border-radius:34%}.location{left:5.5%;width:21%}.photos{left:27%;width:21%}.video{left:48.5%;width:21%}.comment{left:70%;width:21%}.music{position:fixed;z-index:10;right:12px;bottom:12px;border:1px solid #ead4a0;border-radius:40px;background:#344028e8;color:#fff0cc;padding:10px 14px;cursor:pointer;box-shadow:0 3px 14px #0006;font-size:14px}.music:focus-visible{outline:3px solid #fff}.back{position:absolute;z-index:4;top:1%;left:2%;border:1px solid #d9c38a;background:#36412cc9;color:#fff3d3;padding:7px 12px;border-radius:24px;font-size:12px;cursor:pointer}.back:focus-visible{outline:2px solid white}@media(prefers-reduced-motion:reduce){.hotspot::before,.hotspot::after{animation:none}}
</style></head><body><main class="invitation" aria-label="Hager's birthday invitation"><section id="page1" class="screen"><img src="birthday-page1.gif" alt="Hager's birthday invitation, October 28" width="665" height="998"><button type="button" class="hotspot open" id="open" aria-label="Open invitation"></button></section><section id="page2" class="screen" hidden><img src="birthday-page2.gif" alt="Hager's birthday: location, photos, video, and wishes" width="640" height="960"><button type="button" class="hotspot location" aria-label="Location, decorative button only"></button><button type="button" class="hotspot photos" aria-label="Birthday photos, decorative button only"></button><button type="button" class="hotspot video" aria-label="Birthday video, decorative button only"></button><button type="button" class="hotspot comment" aria-label="Leave a sweet comment, decorative button only"></button><button type="button" class="back" id="back" aria-label="Back to first page">‹ Back</button></section></main><audio id="song" src="birthday-song.mp3" preload="auto" loop playsinline></audio><button type="button" class="music" id="music" aria-label="Play or pause birthday music">♫ Play music</button><script>
const one=document.getElementById('page1'),two=document.getElementById('page2'),audio=document.getElementById('song'),music=document.getElementById('music');let manuallyPaused=false;function syncMusic(){music.textContent=audio.paused?'♫ Play music':'♫ Pause music'}async function startMusic(){if(manuallyPaused)return;try{await audio.play()}catch(e){}syncMusic()}function show(page){one.hidden=page!==1;two.hidden=page!==2;window.scrollTo({top:0,behavior:'instant'})}document.getElementById('open').addEventListener('click',()=>{show(2);startMusic()});document.getElementById('back').addEventListener('click',()=>show(1));document.querySelectorAll('#page2 .hotspot').forEach(b=>b.addEventListener('click',()=>{b.classList.remove('pressed');void b.offsetWidth;b.classList.add('pressed');setTimeout(()=>b.classList.remove('pressed'),650);startMusic()}));music.addEventListener('click',async()=>{if(audio.paused){manuallyPaused=false;await startMusic()}else{manuallyPaused=true;audio.pause();syncMusic()}});audio.addEventListener('play',syncMusic);audio.addEventListener('pause',syncMusic);window.addEventListener('load',startMusic);document.addEventListener('pointerdown',()=>{if(audio.paused&&!manuallyPaused)startMusic()},{once:true});
</script></body></html>
